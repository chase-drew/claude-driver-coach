[project]
name = "claude-driver-coach"
version = "0.1.0"
description = "Track-day telemetry analysis from RaceChrono CSV exports, producing structured Markdown reports for AI-assisted driver coaching."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "requests>=2.32",
    "rich>=13.7",
]

[project.scripts]
ddc = "ddc.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ddc"]
